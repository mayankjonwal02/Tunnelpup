# cargo-about settings for the licence notices TunnelPup ships (scripts/licenses.mjs).
# A dependency under any licence not listed here fails the build, so a new one gets a look first.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
]

# The systems release builds are made for.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

# Only what ends up in the app.
ignore-build-dependencies = true
ignore-dev-dependencies = true
