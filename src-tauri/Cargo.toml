[package]
name = "porthop"
version = "0.1.0"
description = "Expose a local port on your own domain through a Cloudflare Tunnel"
authors = ["Mayank Jonwal"]
license = "MIT"
repository = "https://github.com/mayankjonwal02/Porthop"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "porthop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.5.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.53.3", features = ["time", "sync", "net", "macros"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }
gethostname = "1.1.0"

# Ending the connector together with PortHop (src/guard.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
