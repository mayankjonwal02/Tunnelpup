<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- PortHop: a pup peeking out of a tunnel. Source for every app icon;
       regenerate the sizes with: npx tauri icon src-tauri/icons/app-icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA53A"/>
      <stop offset="1" stop-color="#F06A12"/>
    </linearGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- the tunnel: a lit rim and its dark mouth -->
    <path d="M190 960 V572 A322 322 0 0 1 834 572 V960 Z" fill="#FFC680" fill-opacity="0.55"/>
    <path d="M242 960 V572 A270 270 0 0 1 782 572 V960 Z" fill="#3B1606"/>
    <!-- the pup: floppy ears, head, eye patch, muzzle -->
    <ellipse cx="334" cy="608" rx="80" ry="142" transform="rotate(18 334 608)" fill="#9A4313"/>
    <ellipse cx="690" cy="608" rx="80" ry="142" transform="rotate(-18 690 608)" fill="#9A4313"/>
    <ellipse cx="512" cy="616" rx="188" ry="174" fill="#FFF3E2"/>
    <ellipse cx="582" cy="566" rx="64" ry="58" fill="#E9A15C"/>
    <ellipse cx="512" cy="700" rx="106" ry="76" fill="#FFFFFF"/>
    <!-- eyes, nose, smile -->
    <circle cx="444" cy="582" r="27" fill="#2A1206"/>
    <circle cx="582" cy="582" r="27" fill="#2A1206"/>
    <circle cx="453" cy="573" r="9" fill="#FFFFFF"/>
    <circle cx="591" cy="573" r="9" fill="#FFFFFF"/>
    <ellipse cx="512" cy="668" rx="42" ry="30" fill="#2A1206"/>
    <path d="M466 720 Q489 745 512 722 Q535 745 558 720" fill="none" stroke="#2A1206" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- paws on the tunnel's edge -->
    <g fill="#FFF3E2" stroke="#E2B98A" stroke-width="8" stroke-linecap="round">
      <ellipse cx="418" cy="812" rx="70" ry="48" stroke="none"/>
      <ellipse cx="606" cy="812" rx="70" ry="48" stroke="none"/>
      <path d="M398 790 V816 M438 790 V816" fill="none"/>
      <path d="M586 790 V816 M626 790 V816" fill="none"/>
    </g>
  </g>
</svg>
