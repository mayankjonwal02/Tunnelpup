<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- PortHop: a rabbit hopping out of its hole (the tunnel). Source for every app icon;
       regenerate the sizes with: npx tauri icon src-tauri/icons/app-icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B5E"/>
      <stop offset="1" stop-color="#FF9A3D"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <!-- the rabbit hole (the tunnel the rabbit hops out of) -->
  <ellipse cx="282" cy="806" rx="150" ry="46" fill="#8A2B12" fill-opacity="0.38"/>
  <ellipse cx="282" cy="818" rx="118" ry="28" fill="#5E1A08" fill-opacity="0.4"/>
  <!-- the rabbit, mid-leap -->
  <g transform="translate(-28 46)">
    <g fill="#fff" stroke="#fff" stroke-linecap="round">
      <ellipse cx="560" cy="470" rx="205" ry="118" transform="rotate(-24 560 470)" stroke="none"/>
      <circle cx="745" cy="345" r="92" stroke="none"/>
      <line x1="705" y1="285" x2="600" y2="140" stroke-width="66"/>
      <line x1="752" y1="268" x2="712" y2="112" stroke-width="66"/>
      <line x1="705" y1="482" x2="822" y2="538" stroke-width="58"/>
      <line x1="420" y1="585" x2="312" y2="664" stroke-width="80"/>
      <circle cx="432" cy="556" r="96" stroke="none"/>
      <circle cx="372" cy="462" r="54" stroke="none"/>
    </g>
    <circle cx="775" cy="333" r="17" fill="#FF7A50"/>
  </g>
</svg>
